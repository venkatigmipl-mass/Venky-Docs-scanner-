      - name: Add Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps --no-audit --no-fund
          rm -f capacitor.config.ts
          echo '{"appId":"com.docscan.studio","appName":"DocScan Studio","webDir":"dist"}' > capacitor.config.json
          [ -d android ] || npx cap add android
